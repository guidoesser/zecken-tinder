<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <!-- Background glow -->
  <circle cx="60" cy="65" r="55" fill="rgba(232,65,24,0.12)"/>

  <!-- Legs (back) -->
  <g stroke="#5a3a1a" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Left legs -->
    <path d="M36,55 Q15,45 8,35"/>
    <path d="M32,65 Q10,60 4,52"/>
    <path d="M35,75 Q14,78 6,85"/>
    <path d="M40,82 Q22,92 16,102"/>
    <!-- Right legs -->
    <path d="M84,55 Q105,45 112,35"/>
    <path d="M88,65 Q110,60 116,52"/>
    <path d="M85,75 Q106,78 114,85"/>
    <path d="M80,82 Q98,92 104,102"/>
  </g>

  <!-- Body -->
  <ellipse cx="60" cy="68" rx="28" ry="32" fill="#8B4513"/>
  <ellipse cx="60" cy="68" rx="28" ry="32" fill="url(#bodyGrad)"/>

  <!-- Body gradient -->
  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#6B3410"/>
    </radialGradient>
  </defs>

  <!-- Body highlight -->
  <ellipse cx="52" cy="58" rx="10" ry="8" fill="rgba(255,255,255,0.08)"/>

  <!-- Red star on body -->
  <polygon points="60,56 62,62 68,62 63,66 65,72 60,68 55,72 57,66 52,62 58,62" fill="#e74c3c" opacity="0.7"/>

  <!-- Abdomen pattern -->
  <ellipse cx="60" cy="82" rx="16" ry="10" fill="rgba(0,0,0,0.1)"/>

  <!-- Head -->
  <ellipse cx="60" cy="36" rx="18" ry="14" fill="#7a3b10"/>
  <ellipse cx="60" cy="36" rx="18" ry="14" fill="url(#headGrad)"/>
  <defs>
    <radialGradient id="headGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#5a2d0a"/>
    </radialGradient>
  </defs>

  <!-- Eyes -->
  <ellipse cx="51" cy="34" rx="6" ry="6" fill="white"/>
  <ellipse cx="69" cy="34" rx="6" ry="6" fill="white"/>
  <ellipse cx="52" cy="34" rx="3.5" ry="4" fill="#2d1a0a"/>
  <ellipse cx="70" cy="34" rx="3.5" ry="4" fill="#2d1a0a"/>
  <!-- Eye shine -->
  <circle cx="53.5" cy="32.5" r="1.5" fill="white"/>
  <circle cx="71.5" cy="32.5" r="1.5" fill="white"/>

  <!-- Heart eyes -->
  <g opacity="0.6">
    <text x="44" y="30" font-size="8">❤️</text>
    <text x="65" y="30" font-size="8">❤️</text>
  </g>

  <!-- Smile -->
  <path d="M53,40 Q60,46 67,40" stroke="#3a1a05" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Cheeks -->
  <ellipse cx="44" cy="39" rx="3" ry="2" fill="#e74c3c" opacity="0.25"/>
  <ellipse cx="76" cy="39" rx="3" ry="2" fill="#e74c3c" opacity="0.25"/>

  <!-- Antennae -->
  <path d="M54,24 Q48,10 40,4" stroke="#5a3a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="40" cy="4" r="2.5" fill="#e74c3c"/>
  <path d="M66,24 Q72,10 80,4" stroke="#5a3a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="80" cy="4" r="2.5" fill="#e74c3c"/>

  <!-- Floating small hearts -->
  <g opacity="0.4">
    <text x="15" y="25" font-size="8">❤️</text>
    <text x="95" y="20" font-size="6">❤️</text>
    <text x="8" y="80" font-size="6">❤️</text>
    <text x="100" y="90" font-size="7">❤️</text>
  </g>
</svg>
