<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zecken Tinder 💚</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Background pattern — anarcho-punk dots */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(232, 65, 24, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 24px;
      position: relative;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #e84118, #c0392b, #e84118);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      position: relative;
    }

    .logo .tick {
      font-size: 40px;
      -webkit-text-fill-color: initial;
      color: #e84118;
    }

    .logo .bee {
      -webkit-text-fill-color: initial;
    }

    .subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Stats bar */
    .stats {
      display: flex;
      justify-content: space-between;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 12px 20px;
      margin-bottom: 20px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      color: #fff;
      font-size: 20px;
      font-weight: 800;
    }

    .stat-label {
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Card deck */
    .card-deck {
      position: relative;
      height: 560px;
      margin-bottom: 20px;
    }

    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      background: #1e1e2e;
      border: 1px solid rgba(255,255,255,0.08);
      user-select: none;
      touch-action: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: grab;
    }

    .card:active { cursor: grabbing; }

    .card.next {
      transform: scale(0.95) translateY(12px);
      z-index: 1;
      opacity: 0.7;
    }

    .card.current {
      z-index: 2;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .card.dragging {
      transition: none !important;
    }

    /* Avatar area */
    .card-avatar {
      width: 100%;
      height: 55%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .card-avatar .emoji-bg {
      font-size: 120px;
      line-height: 1;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.3));
    }

    .card-avatar .avatar-gradient {
      position: absolute;
      inset: 0;
      opacity: 0.3;
    }

    /* Swipe indicators */
    .swipe-indicator {
      position: absolute;
      top: 24px;
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      border: 3px solid;
      opacity: 0;
      transition: opacity 0.2s ease;
      transform: rotate(-15deg);
      z-index: 10;
    }

    .swipe-indicator.nope {
      right: 24px;
      color: #8B4513;
      border-color: #8B4513;
    }

    .swipe-indicator.like {
      left: 24px;
      color: #e74c3c;
      border-color: #e74c3c;
    }

    .card.current .swipe-indicator.show {
      opacity: 1;
    }

    /* Card info */
    .card-info {
      padding: 20px 24px;
      height: 45%;
      display: flex;
      flex-direction: column;
    }

    .card-name-age {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }

    .card-name-age .name {
      color: #fff;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .card-name-age .age {
      color: rgba(255,255,255,0.5);
      font-size: 22px;
      font-weight: 600;
    }

    .card-location {
      color: rgba(255,255,255,0.4);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .card-tag {
      background: rgba(232, 65, 24, 0.15);
      color: #e84118;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .card-tag.green {
      background: rgba(46, 204, 113, 0.15);
      color: #2ecc71;
    }

    .card-tag.purple {
      background: rgba(155, 89, 182, 0.15);
      color: #9b59b6;
    }

    .card-bio {
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      line-height: 1.5;
      flex: 1;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    /* Swipe hint at bottom of card */
    .swipe-hint {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: rgba(255,255,255,0.25);
      user-select: none;
    }

    .swipe-hint .hint-left { color: rgba(231, 76, 60, 0.5); }
    .swipe-hint .hint-right { color: rgba(139, 69, 19, 0.5); }

    /* Action buttons */
    .actions {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 8px 0;
    }

    .action-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      position: relative;
    }

    .action-btn:hover { transform: scale(1.1); }
    .action-btn:active { transform: scale(0.95); }

    .action-btn.like { color: #e74c3c; }
    .action-btn.like:hover { background: rgba(231, 76, 60, 0.2); border-color: #e74c3c; }

    .action-btn.nope { color: rgba(255,255,255,0.3); }
    .action-btn.nope:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }

    .action-btn.super { color: #3498db; font-size: 24px; }
    .action-btn.super:hover { background: rgba(52, 152, 219, 0.2); border-color: #3498db; }

    /* Match modal */
    .match-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(20px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .match-overlay.show { display: flex; }

    .match-content {
      text-align: center;
      padding: 40px;
      animation: matchPop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes matchPop {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .match-content .match-icon {
      font-size: 80px;
      margin-bottom: 16px;
      animation: matchBounce 0.6s ease infinite alternate;
    }

    @keyframes matchBounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }

    .match-content h2 {
      color: #fff;
      font-size: 36px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .match-content p {
      color: rgba(255,255,255,0.6);
      font-size: 18px;
      margin-bottom: 32px;
    }

    .match-btn {
      background: linear-gradient(135deg, #e84118, #c0392b);
      color: #fff;
      border: none;
      padding: 14px 40px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .match-btn:hover { transform: scale(1.05); }

    .match-close {
      background: transparent;
      color: rgba(255,255,255,0.4);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 12px 32px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-left: 12px;
      transition: all 0.2s ease;
    }

    .match-close:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.3);
    }

    /* Particles / confetti */
    .confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      animation: confettiFall 3s ease-in forwards;
    }

    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* Empty state */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 560px;
      text-align: center;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 24px;
    }

    .empty-state.show { display: flex; }

    .empty-state .icon { font-size: 72px; margin-bottom: 16px; }
    .empty-state h3 { color: #fff; font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .empty-state p { color: rgba(255,255,255,0.4); font-size: 15px; max-width: 280px; }

    .empty-state .reset-btn {
      margin-top: 24px;
      background: rgba(232, 65, 24, 0.15);
      color: #e84118;
      border: 1px solid rgba(232, 65, 24, 0.3);
      padding: 12px 28px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .empty-state .reset-btn:hover {
      background: rgba(232, 65, 24, 0.25);
    }
  </style>
</head>
<body>

    </div>

    <!-- Stats -->
    <div class="stats">

    <!-- Card Deck -->
    <div class="card-deck" id="cardDeck">
      <!-- Cards injected by JS -->
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
      <div class="icon">🏕️</div>
      <h3>Alle abgeswiped!</h3>

      <button class="reset-btn" onclick="resetAll()">↻ Nochmal von vorne</button>

    <!-- Action Buttons -->
    <div class="actions" id="actions">
      <button class="action-btn like" onclick="swipe('like')">❤️</button>
      <button class="action-btn super" onclick="swipe('super')">⭐</button>
      <button class="action-btn nope" onclick="swipe('nope')">✕</button>

  </div>

  <!-- Match Overlay -->
  <div class="match-overlay" id="matchOverlay">
    <div class="match-content">
      <div class="match-icon">❤️</div>
      <h2>ES HAT GEFUNKT! 🔥</h2>
      <p id="matchText">Du und <span id="matchName"></span> — das wird was!</p>
      <div>
        <button class="match-btn" onclick="closeMatch()">💬 Nachricht schreiben</button>
        <button class="match-close" onclick="closeMatch()">Weiter swipen</button>
      </div>
    </div>
  </div>

  <!-- Confetti Container -->
  <div class="confetti-container" id="confettiContainer"></div>

  <script>
    // ─── Profile Data ───────────────────────────────────────────
    const PROFILES = [
      {
        name: 'Karla',

        emoji: '🎙️',

        tags: ['Journalismus', 'Freies Radio', 'Spenden sammeln', 'Kaffeehaus'],
        bio: 'Schreib für ne linke Tageszeitung und mach Radio auf FreeFM. Such jemanden für lange Nächte im Café討論 über Gramsci und wer grad die beste Falafel in Ehrenfeld hat.'
      },
      {
        name: 'Lotta',
        age: 24,
        location: 'Freiburg',
        emoji: '🚲',
        color: '#f1c40f',
        tags: ['"Ich mach BWL nur fürs System"', 'Fahrrad', 'CSD-Orga', 'Zero Waste'],
        bio: '"BWL-Studentin — aber nur um das System von innen zu verändern!" Fahre Fahrrad (ohne Helm, aus Prinzip). Organisiere den CSD in Freiburg mit.'

      {

        age: 29,

        color: '#e74c3c',

        bio: 'Hacke für die Antifa und betreibe einen eigenen Matrix-Server. Such jemanden, der Signal installiert hat und weiss, was ein PAHE ist. Kiffe nicht, hab aber nix dagegen.'
      },
      {
        name: 'Marie',
        age: 27,
        location: 'Dresden',
        emoji: '🐱',
        color: '#e67e22',
        tags: ['Pflege', 'Kundgebungen', '4 Katzen', 'Strickkreis'],
        bio: 'Arbeite in der Pflege und organisier Kundgebungen gegen rechts. Hab 4 Katzen (alle gerettet). Such jemanden, der sonntags mit mir in den Strickkreis kommt.'
      },
      {
        name: 'Can',
        age: 30,
        location: 'München',
        emoji: '🌯',
        color: '#1abc9c',
        tags: ['Jura', 'NGO', 'Vegane Döner-Bowl', 'Theorie'],
        bio: 'Mach Jura für ne NGO — Prozesskostenhilfe und Asylrecht. Koch die beste vegane Döner-Bowl der Stadt. Such jemanden, der Bock hat abends mal über Staatstheorie zu diskutieren.'

      {
        name: 'Fine',
        age: 25,
        location: 'Hannover',
        emoji: '🎵',
        color: '#e84393',
        tags: ['Veranstaltungstechnik', 'Soli-Konzerte', 'Punk', 'Kabelmanagement'],
        bio: 'Schmeiß die besten Soli-Konzerte im UJZ. Hab n Kabelmanagement, von dem Benno nur träumen kann. Such jemanden zum Moshpitten und danach Tee trinken.'
      },
      {
        name: 'Ole',
        age: 32,
        location: 'Bremen',

        color: '#00b894',
        tags: ['Tischler', 'Kollektiv-Werkstatt', 'Mobile Bühnen', 'Permakultur'],
        bio: 'Tischler in ner kollektiv betriebenen Werkstatt. Bau mobile Bühnen für Demos und grad nen Tiny House. Such jemanden für gemeinsame Projekte und Permakultur-Wochenenden.'
      },
      {
        name: 'Svenja',
        age: 29,
        location: 'Münster',
        emoji: '📚',
        color: '#fd79a8',
        tags: ['Verlag', 'Lektorat', 'Antirassismus', 'Buchmesse'],
        bio: 'Lektorin in nem linken Verlag. Korrekturlese Flugblätter gratis. Such jemanden, der auf der Buchmesse mit mir anstellt und über Verteilungsgerechtigkeit diskutiert.'
      },
      {
        name: 'Nick',
        age: 27,
        location: 'Kassel',
        emoji: '🎭',
        color: '#6c5ce7',
        tags: ['Theater', 'postmigrantisch', 'Impro', 'Kulturschaffend'],
        bio: 'Mache postmigrantisches Theater und Impro-Shows. Organisiere die nächste Kulturwoche. Such jemanden, der mit mir über nasses vs idealistischen Materialismus streitet — und dann lachen kann.'
      }
    ];

    let currentIndex = 0;
    let matches = 0;
    let nopes = 0;
    let likes = 0;
    let matchedProfiles = [];
    let isAnimating = false;
    let swipeState = null;

    // ─── Init ───────────────────────────────────────────────────
    function init() {
      renderCards();
      updateStats();
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // ─── Render Cards ────────────────────────────────────────────
    function renderCards() {
      const deck = document.getElementById('cardDeck');
      deck.innerHTML = '';
      const empty = document.getElementById('emptyState');
      const actions = document.getElementById('actions');

      if (currentIndex >= PROFILES.length) {
        deck.innerHTML = '';
        empty.classList.add('show');
        actions.style.display = 'none';
        return;
      }

      empty.classList.remove('show');
      actions.style.display = 'flex';

      const profile = PROFILES[currentIndex];
      const nextProfile = PROFILES[currentIndex + 1];

      if (nextProfile) {
        deck.appendChild(createCardElement(nextProfile, 'next'));
      }
      deck.appendChild(createCardElement(profile, 'current'));

      setupDrag();
    }

    function createCardElement(profile, className) {
      const div = document.createElement('div');
      div.className = `card ${className}`;
      div.dataset.index = PROFILES.indexOf(profile);

      div.innerHTML = `
        <div class="card-avatar" style="background: linear-gradient(135deg, ${profile.color}33, ${profile.color}11);">
          <div class="avatar-gradient" style="background: radial-gradient(circle at 50% 100%, ${profile.color}22, transparent);"></div>
          <span class="emoji-bg">${profile.emoji}</span>
          <div class="swipe-indicator nope">💩 NOPE</div>
          <div class="swipe-indicator like">❤️ MATCH</div>
        </div>
        <div class="card-info">
          <div class="card-name-age">
            <span class="name">${profile.name}</span>
            <span class="age">${profile.age}</span>
          </div>
          <div class="card-location">📍 ${profile.location}</div>
          <div class="card-tags">
            ${profile.tags.map((tag, i) => {
              const cls = i % 3 === 0 ? 'green' : i % 3 === 1 ? 'purple' : '';
              return `<span class="card-tag ${cls}">${tag}</span>`;
            }).join('')}
          </div>
          <div class="card-bio">${profile.bio}</div>
          <div class="swipe-hint">
            <span class="hint-left">❤️ Match</span>
            <span class="hint-right">💩 Nope</span>
          </div>
        </div>
      `;

      return div;
    }

    // ─── Drag to Swipe — Unified (Pointer or Touch, never both) ──
    function setupDrag() {
      const card = document.querySelector('.card.current');
      if (!card) return;

      // Cleanup any leftover listeners from previous rounds
      cleanupDrag();

      // Use Pointer Events if supported, otherwise Touch
      if (window.PointerEvent) {
        card.addEventListener('pointerdown', onDragStart, { passive: true });
      } else {
        card.addEventListener('touchstart', onDragStart, { passive: true });
      }
    }

    let _onMove = null;
    let _onEnd = null;

    function cleanupDrag() {
      if (_onMove) {
        if (window.PointerEvent) {
          document.removeEventListener('pointermove', _onMove);
          document.removeEventListener('pointerup', _onEnd);
        } else {
          document.removeEventListener('touchmove', _onMove, { passive: false });
          document.removeEventListener('touchend', _onEnd);
        }
        _onMove = null;
        _onEnd = null;
      }
      swipeState = null;
    }

    function onDragStart(e) {
      if (isAnimating) return;
      cleanupDrag();

      const card = e.currentTarget;
      if (!card) return;

      const point = e.touches ? e.touches[0] : e;
      if (!point) return;

      swipeState = { card, startX: point.clientX, startY: point.clientY };
      card.classList.add('dragging');

      if (window.PointerEvent) {
        _onMove = (ev) => { ev.preventDefault(); onDragMove(ev, null); };
        _onEnd = (ev) => onDragEnd(ev);
        document.addEventListener('pointermove', _onMove, { passive: false });
        document.addEventListener('pointerup', _onEnd);
      } else {
        _onMove = (ev) => { ev.preventDefault(); onDragMove(ev, ev.touches[0]); };
        _onEnd = (ev) => onDragEnd(ev);
        document.addEventListener('touchmove', _onMove, { passive: false });
        document.addEventListener('touchend', _onEnd);
      }
    }

    function onDragMove(e, pointOverride) {
      if (!swipeState) return;
      const point = pointOverride || e;
      const dx = point.clientX - swipeState.startX;
      const dy = point.clientY - swipeState.startY;
      const rotate = dx * 0.08;

      swipeState.card.style.transform = `translate(${dx}px, ${dy}px) rotate(${rotate}deg)`;

      // Show indicators — left = match (❤️), right = nope (💩)
      const indLike = swipeState.card.querySelector('.swipe-indicator.like');
      const indNope = swipeState.card.querySelector('.swipe-indicator.nope');
      const threshold = 80;

      if (dx < -threshold) {
        indNope?.classList.add('show');
        indLike?.classList.remove('show');
      } else if (dx > threshold) {
        indLike?.classList.add('show');
        indNope?.classList.remove('show');
      } else {
        indLike?.classList.remove('show');
        indNope?.classList.remove('show');
      }
    }

    function onDragEnd(e) {
      if (!swipeState) return;

      const card = swipeState.card;
      card.classList.remove('dragging');

      // Get end position
      const point = e.changedTouches ? e.changedTouches[0] : e;
      const dx = point ? point.clientX - swipeState.startX : 0;
      const threshold = 100;

      cleanupDrag();

      if (dx < -threshold) {
        animateSwipe(card, 'left', 'nope');
      } else if (dx > threshold) {
        animateSwipe(card, 'right', 'like');
      } else {
        card.style.transform = '';
        card.querySelector('.swipe-indicator.nope')?.classList.remove('show');
        card.querySelector('.swipe-indicator.like')?.classList.remove('show');
      }
    }

    // ─── Swipe Actions (Buttons) ─────────────────────────────────
    function swipe(type) {
      if (isAnimating) return;
      const card = document.querySelector('.card.current');
      if (!card) return;

      if (type === 'like') animateSwipe(card, 'right', 'like');
      else if (type === 'nope') animateSwipe(card, 'left', 'nope');
      else if (type === 'super') animateSwipe(card, 'up', 'super');
    }

    function animateSwipe(card, direction, type) {
      if (isAnimating) return;
      isAnimating = true;

      const dist = direction === 'up' ? 500 : 600;
      const x = direction === 'left' ? -dist : direction === 'right' ? dist : 0;
      const y = direction === 'up' ? -dist : 50;
      const rotate = direction === 'left' ? -30 : direction === 'right' ? 30 : 0;

      card.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
      card.style.transform = `translate(${x}px, ${y}px) rotate(${rotate}deg)`;
      card.style.opacity = '0';

      // Handle result
      setTimeout(() => {
        if (type === 'like') {
          likes++;
          // 40% chance of match on like
          if (Math.random() < 0.4) {
            matches++;
            matchedProfiles.push(PROFILES[currentIndex]);
            showMatch(PROFILES[currentIndex]);
            spawnConfetti();
          }
        } else if (type === 'nope') {
          nopes++;
        } else if (type === 'super') {
          likes++;
          // 70% chance on super like
          if (Math.random() < 0.7) {
            matches++;
            matchedProfiles.push(PROFILES[currentIndex]);
            showMatch(PROFILES[currentIndex]);
            spawnConfetti();
          }
        }

        currentIndex++;
        updateStats();
        renderCards();
        isAnimating = false;
      }, 400);
    }

    // ─── Match Modal ────────────────────────────────────────────
    function showMatch(profile) {
      document.getElementById('matchName').textContent = profile.name;
      document.getElementById('matchOverlay').classList.add('show');
    }

    function closeMatch() {
      document.getElementById('matchOverlay').classList.remove('show');
    }

    // ─── Confetti ───────────────────────────────────────────────
    function spawnConfetti() {
      const container = document.getElementById('confettiContainer');
      const colors = ['#e84118', '#2ecc71', '#3498db', '#f1c40f', '#9b59b6', '#e84393', '#1abc9c', '#fd79a8'];

      for (let i = 0; i < 80; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + '%';
        el.style.top = '-10px';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.width = (Math.random() * 8 + 4) + 'px';
        el.style.height = (Math.random() * 8 + 4) + 'px';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        el.style.animationDuration = (Math.random() * 2 + 2) + 's';
        el.style.animationDelay = Math.random() * 0.5 + 's';
        container.appendChild(el);

        setTimeout(() => el.remove(), 4000);
      }
    }

    // ─── Stats ──────────────────────────────────────────────────
    function updateStats() {
      document.getElementById('matchedCount').textContent = matches;
      document.getElementById('nopeCount').textContent = nopes;
      document.getElementById('likeCount').textContent = likes;
    }

    // ─── Reset ──────────────────────────────────────────────────
    function resetAll() {
      currentIndex = 0;
      matches = 0;
      nopes = 0;
      likes = 0;
      matchedProfiles = [];
      shuffleArray(PROFILES);
      updateStats();
      renderCards();

      // Scroll to top
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ─── Keyboard shortcuts ─────────────────────────────────────
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') swipe('nope');
      if (e.key === 'ArrowRight') swipe('like');
      if (e.key === 'ArrowUp') swipe('super');
    });

    // ─── Go! ────────────────────────────────────────────────────
    shuffleArray(PROFILES);
    init();
  </script>
</body>
</html>
